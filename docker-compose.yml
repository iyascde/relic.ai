version: "3.9"

services:
  relic-ai:
    build: .
    container_name: relic-ai
    ports:
      - "5050:5050"
    volumes:
      - .:/app
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
